<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momdoマッサージ整体｜福岡市城南区七隈</title>
    <style>
        /* ==========================================================================
           🎨 サイバーテック・コアカラー＆バックグラウンド定義
           ========================================================================== */
        :root {
            --bg-base: #000511;       /* 漆黒の宇宙空間 */
            --sapphire: #001238;      /* 深淵のサファイアブルー */
            --gold: #e5c158;          /* 輝く高純度ゴールド */
            --gold-glow: rgba(229, 193, 88, 0.4);
            --neon-cyan: #00f0ff;     /* 体をハックするネオンシアン */
            --cyan-glow: rgba(0, 240, 255, 0.5);
            --text-main: #ffffff;
            --text-sub: #8fa3cc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 30%, var(--sapphire) 0%, var(--bg-base) 70%),
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            color: var(--text-main);
            font-family: 'Times New Roman', 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
            line-height: 1.8;
            overflow-x: hidden;
            letter-spacing: 0.05em;
        }

        a { color: inherit; text-decoration: none; }

        section {
            padding: 80px 24px;
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            border-bottom: 1px solid rgba(0, 240, 255, 0.05);
        }

        .section-title {
            font-size: 28px;
            color: var(--gold);
            text-align: center;
            margin-bottom: 50px;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 15px var(--gold-glow);
            font-weight: 600;
        }
        .section-title.cyan {
            color: var(--neon-cyan);
            text-shadow: 0 0 15px var(--cyan-glow);
        }

        .btn-gold {
            display: inline-block;
            padding: 16px 36px;
            background: rgba(0, 5, 17, 0.6);
            color: var(--gold);
            border: 1px solid var(--gold);
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.4s ease;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 0 10px rgba(229, 193, 88, 0.1);
            backdrop-filter: blur(5px);
        }
        .btn-gold:hover {
            background: var(--gold);
            color: var(--bg-base);
            box-shadow: 0 0 25px var(--gold);
            transform: translateY(-2px);
        }

        .btn-neon {
            display: inline-block;
            padding: 16px 36px;
            background: rgba(0, 5, 17, 0.6);
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            font-weight: bold;
            letter-spacing: 2px;
            transition: all 0.4s ease;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
            backdrop-filter: blur(5px);
        }
        .btn-neon:hover {
            background: var(--neon-cyan);
            color: var(--bg-base);
            box-shadow: 0 0 30px var(--neon-cyan);
            transform: translateY(-2px);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 24px;
            max-width: 1200px;
            margin: 0 auto;
            border-bottom: 1px solid rgba(0, 240, 255, 0.08);
        }
        .logo-text {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 8px;
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .hero {
            text-align: center;
            padding: 120px 24px 140px;
            position: relative;
        }
        .hero-subtitle {
            color: var(--gold);
            font-size: 14px;
            letter-spacing: 6px;
            margin-bottom: 25px;
            text-shadow: 0 0 8px var(--gold-glow);
            font-weight: 600;
        }
        .hero-title {
            font-size: 44px;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 35px;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .hero-desc {
            color: var(--text-sub);
            max-width: 650px;
            margin: 0 auto 50px;
            font-size: 15px;
            line-height: 2;
        }
        .hero-cta-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 320px;
            margin: 0 auto;
        }

        .gateways {
            display: grid;
            grid-template-columns: 1fr;
            gap: 35px;
            margin-top: 20px;
        }
        .gate-card {
            border: 1px solid rgba(229, 193, 88, 0.2);
            padding: 45px 30px;
            text-align: center;
            background: linear-gradient(135deg, rgba(0, 18, 56, 0.6) 0%, rgba(0, 5, 17, 0.8) 100%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }
        .gate-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--gold);
        }
        .gate-card.explorer {
            border-color: rgba(0, 240, 255, 0.3);
            background: linear-gradient(135deg, rgba(0, 30, 80, 0.4) 0%, rgba(0, 5, 17, 0.9) 100%);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.05);
        }
        .gate-card.explorer::before {
            background: var(--neon-cyan);
        }
        .gate-card h3 { font-size: 22px; margin-bottom: 15px; letter-spacing: 2px; }
        .gate-card.explorer h3 { color: var(--neon-cyan); text-shadow: 0 0 10px var(--cyan-glow); }
        .gate-card p { font-size: 14px; color: var(--text-sub); margin-bottom: 35px; }

        .voice-card {
            background: rgba(0, 18, 56, 0.4);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 30px;
            border-left: 4px solid var(--gold);
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .voice-meta { font-size: 12px; color: var(--gold); margin-bottom: 8px; letter-spacing: 1px; }

        .price-cat {
            color: var(--gold);
            font-size: 16px;
            margin: 40px 0 15px;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-left: 2px solid var(--gold);
            padding-left: 12px;
            font-weight: bold;
        }
        .price-row {
            display: flex;
            justify-content: space-between;
            padding: 16px 5px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 15px;
            transition: background 0.3s;
        }
        .price-row:hover { background: rgba(0, 240, 255, 0.02); }

        /* コクピット風アクセスボックス */
        .access-box {
            text-align: center;
            background: linear-gradient(180deg, rgba(0, 18, 56, 0.8) 0%, rgba(0, 5, 17, 0.9) 100%);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 50px 30px;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.05);
            position: relative;
        }
        .access-box h3 { color: var(--gold); letter-spacing: 2px; margin-bottom: 20px; font-size: 22px; }
        .access-box p { color: var(--text-sub); margin-bottom: 12px; font-size: 15px; }

        .btn-tel { background: var(--gold); color: var(--bg-base); font-weight: bold; padding: 16px; border: none; display: block; text-align: center; width: 100%; letter-spacing: 1px; box-shadow: 0 0 15px var(--gold-glow); transition: all 0.3s; }
        .btn-tel:hover { transform: translateY(-2px); box-shadow: 0 0 25px var(--gold); }
        .btn-line { background: #06C755; color: #ffffff; font-weight: bold; padding: 16px; border: none; display: block; text-align: center; width: 100%; letter-spacing: 1px; box-shadow: 0 0 15px rgba(6, 199, 85, 0.3); transition: all 0.3s; }
        .btn-line:hover { transform: translateY(-2px); box-shadow: 0 0 25px #06C755; }

        .blog-card {
            background: rgba(0, 18, 56, 0.3);
            padding: 25px;
            border-radius: 4px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.03);
        }
        .blog-tag {
            display: inline-block;
            font-size: 11px;
            background: rgba(229, 193, 88, 0.15);
            color: var(--gold);
            padding: 3px 10px;
            border-radius: 2px;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .blog-card.manga .blog-tag {
            background: rgba(0, 240, 255, 0.15);
            color: var(--neon-cyan);
        }

        @media (min-width: 768px) {
            .hero-title { font-size: 56px; }
            .hero-cta-group { flex-direction: row; max-width: 600px; }
            .hero-cta-group a { flex: 1; }
            .gateways { grid-template-columns: 1fr 1fr; }
            .hero-cta-group-access { display: flex; gap: 20px; max-width: 500px; margin: 30px auto 0; }
            .hero-cta-group-access a { flex: 1; margin-top: 0 !important; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-text">MOMDO</div>
        <div style="font-size: 13px; color: var(--gold); letter-spacing: 2px;">七隈 | 金山駅徒歩2分</div>
    </header>
