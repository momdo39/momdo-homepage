<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momdoマッサージ整体｜福岡市城南区七隈・金山駅徒歩2分</title>
    <style>
        /* ==========================================================================
           🎨 共通スタイル & カラー定義（サファイアブルー × ゴールド × ホワイト）
           ========================================================================== */
        :root {
            --bg-dark: #000c24;       /* サファイアブルーのベース（極暗） */
            --bg-gradient: radial-gradient(circle at center, #001f5c 0%, #000c24 100%);
            --gold: #d4af37;          /* ゴールド（アクセント・見出し） */
            --neon-blue: #00f0ff;     /* BODY EXPLORER用のネオンブルー */
            --text-white: #ffffff;
            --text-gray: #b0c4de;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-dark);
            background: var(--bg-gradient);
            color: var(--text-white);
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            line-height: 1.7;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* セクション共通 */
        section {
            padding: 80px 20px;
            max-width: 1000px;
            margin: 0 auto;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        }

        .section-title {
            font-size: 28px;
            color: var(--gold);
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: 2px;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 50px;
            height: 2px;
            background: var(--gold);
            margin: 15px auto 0;
        }

        /* ボタン共通 */
        .btn-gold {
            display: inline-block;
            padding: 15px 35px;
            background: transparent;
            color: var(--gold);
            border: 2px solid var(--gold);
            border-radius: 4px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            cursor: pointer;
            text-align: center;
        }

        .btn-gold:hover {
            background: var(--gold);
            color: var(--bg-dark);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        .btn-neon {
            display: inline-block;
            padding: 15px 35px;
            background: transparent;
            color: var(--neon-blue);
            border: 2px solid var(--neon-blue);
            border-radius: 4px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .btn-neon:hover {
            background: var(--neon-blue);
            color: var(--bg-dark);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
        }

        /* ==========================================================================
           📱 各セクションのレイアウト
           ========================================================================== */
        
        /* 01｜ファーストビュー & ヘッダー */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-white);
            letter-spacing: 3px;
        }
        .hero {
            text-align: center;
            padding: 100px 20px 140px;
        }
        .hero-subtitle {
            color: var(--gold);
            font-size: 16px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .hero-title {
            font-size: 48px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .hero-desc {
            font-size: 16px;
            color: var(--text-gray);
            max-width: 600px;
            margin: 0 auto 40px;
        }
        .hero-meta {
            font-size: 14px;
            color: var(--gold);
            margin-bottom: 40px;
        }
        .hero-cta-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 300px;
            margin: 0 auto;
        }

        /* 02｜Momdoの考え方 */
        .concept-box {
            text-align: center;
            max-width: 700px;
            margin: 0 auto;
        }
        .concept-highlight {
            font-size: 24px;
            color: var(--gold);
            margin-bottom: 20px;
        }

        /* 03｜2つの入口 */
        .gateways {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }
        .gate-card {
            border: 1px solid rgba(255,255,255,0.1);
            padding: 40px 20px;
            text-align: center;
            border-radius: 8px;
            background: rgba(255,255,255,0.02);
        }
        .gate-card.explorer {
            border-color: rgba(0, 240, 255, 0.3);
            background: linear-gradient(180deg, rgba(0, 240, 255, 0.02) 0%, transparent 100%);
        }
        .gate-card h3 {
            font-size: 22px;
            margin-bottom: 15px;
        }
        .gate-card.explorer h3 { color: var(--neon-blue); }
        .gate-card h3::after {
            content: ''; display: block; width: 30px; height: 1px; background: currentColor; margin: 10px auto 0;
        }
        .gate-card p {
            font-size: 14px; color: var(--text-gray); margin-bottom: 30px;
        }

        /* 04 & 05｜施術 & BODY EXPLORER誘導 */
        .info-block {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 30px;
        }

        /* 06｜生まれた理由 */
        .story-content {
            max-width: 700px;
            margin: 0 auto;
            color: var(--text-gray);
        }
        .story-content p { margin-bottom: 20px; }

        /* 07｜お客様の声 */
        .voice-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        .voice-card {
            background: rgba(255,255,255,0.03);
            padding: 25px;
            border-left: 3px solid var(--gold);
            border-radius: 0 4px 4px 0;
        }
        .voice-meta {
            font-size: 13px;
            color: var(--gold);
            margin-bottom: 10px;
        }

        /* 08｜メニュー・料金 */
        .price-table-wrapper {
            margin-bottom: 30px;
        }
        .price-cat-title {
            color: var(--gold);
            font-size: 18px;
            margin: 30px 0 15px;
            border-bottom: 1px solid rgba(212,175,55,0.3);
            padding-bottom: 5px;
        }
        .price-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 5px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 15px;
        }
        .price-row .price {
            font-weight: bold;
            color: var(--gold);
        }

        /* 09｜よくある質問 */
        .faq-item {
            margin-bottom: 25px;
            background: rgba(255,255,255,0.02);
            padding: 20px;
            border-radius: 6px;
        }
        .faq-q {
            font-weight: bold;
            color: var(--gold);
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
        }
        .faq-a {
            color: var(--text-gray);
            font-size: 14px;
            padding-left: 24px;
        }

        /* 10｜アクセス・予約 */
        .access-box {
            text-align: center;
            background: rgba(0, 31, 92, 0.3);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 40px 20px;
            border-radius: 8px;
        }
        .access-info h3 { color: var(--gold); margin-bottom: 15px; font-size: 20px;}
        .access-info p { margin-bottom: 10px; font-size: 15px;}
        .cta-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
        }
        .btn-tel { background: #d4af37; color: #000c24; border: none; font-weight: bold; padding: 15px; border-radius: 4px; text-align: center;}
        .btn-line { background: #06C755; color: #fff; border: none; font-weight: bold; padding: 15px; border-radius: 4px; text-align: center;}

        /* 11｜ブログ・お知らせ */
        .blog-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        .blog-card {
            background: rgba(255,255,255,0.02);
            padding: 20px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .blog-tag {
            display: inline-block;
            font-size: 11px;
            background: rgba(212, 175, 55, 0.2);
            color: var(--gold);
            padding: 2px 8px;
            border-radius: 3px;
            margin-bottom: 10px;
        }
        .blog-card.manga .blog-tag {
            background: rgba(0, 240, 255, 0.2);
            color: var(--neon-blue);
        }
        .blog-title { font-weight: bold; margin-bottom: 5px; font-size: 16px;}
        .blog-date { font-size: 12px; color: var(--text-gray); }

        footer {
            text-align: center;
            padding: 40px 20px;
            font-size: 12px;
            color: var(--text-gray);
            border-top: 1px solid rgba(255,255,255,0.05);
        }
