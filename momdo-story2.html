<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOMDO BODY EXPLORER - 身体を知る</title>
    <style>
        :root {
            --bg-color: #0d1b2a;
            --card-bg: #1b263b;
            --accent-color: #415a77;
            --text-color: #e0e1dd;
            --highlight-blue: #00b4d8;
            --highlight-orange: #f77f00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: linear-gradient(145deg, #0f2038, #050b14);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* メインレイアウト */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        /* 左カラム: ビジュアル・ステップ */
        .left-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .brand-title {
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            color: rgba(255,255,255,0.5);
        }

        .main-heading {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
            background: linear-gradient(to right, #fff, #a2d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-heading {
            font-size: 1.3rem;
            color: var(--highlight-blue);
            margin-bottom: 15px;
        }

        .intro-text {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 25px;
        }

        /* ステップリスト */
        .step-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .step-item {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.03);
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid var(--highlight-blue);
            transition: all 0.3s ease;
        }

        .step-item.active {
            border-left-color: var(--highlight-orange);
            background: rgba(247, 127, 0, 0.05);
        }

        .step-badge {
            font-size: 0.7rem;
            font-weight: bold;
            background: #222;
            padding: 4px 8px;
            border-radius: 4px;
            margin-right: 15px;
            text-align: center;
            min-width: 60px;
        }
        
        .step-badge span {
            display: block;
            font-size: 0.9rem;
            color: var(--highlight-blue);
        }
        .step-item.active .step-badge span {
            color: var(--highlight-orange);
        }

        .step-content {
            font-size: 0.9rem;
        }

        /* 3Dモデル仮設置エリア */
        .model-placeholder {
            width: 100%;
            height: 400px;
            background: radial-gradient(circle, rgba(65,90,119,0.2) 0%, rgba(13,27,42,0) 70%);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border: 1px dashed rgba(255,255,255,0.1);
        }
        .model-placeholder::after {
            content: "ここに人体のメインビジュアル画像・または3D要素を配置";
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
        }

        /* 右カラム: 詳細解説・カード */
        .right-column {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .section-box {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 20px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .section-step-badge {
            background: var(--highlight-blue);
            color: #fff;
            font-size: 0.8rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: bold;
        }

        .section-desc {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.8);
            margin-bottom: 20px;
        }

        /* 部位カードグリッド */
        .parts-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        @media (max-width: 576px) {
            .parts-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .part-card {
            background: var(--card-bg);
            border-radius: 6px;
            padding: 12px;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .part-card:hover, .part-card.selected {
            transform: translateY(-4px);
            box-shadow: 0 6px 15px rgba(0, 180, 216, 0.3);
            border-color: var(--highlight-blue);
        }
        
        .part-card.selected {
            background: linear-gradient(135deg, #1b263b, #00b4d822);
        }

        .part-img-mock {
            width: 100%;
            height: 70px;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
        }

        .part-name {
            font-size: 0.9rem;
            font-weight: bold;
            color: #fff;
        }

        .part-info {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.6);
        }

        /* アニメーション・動きを見るエリア */
        .animation-box {
            background: rgba(0, 180, 216, 0.03);
            border: 1px solid rgba(0, 180, 216, 0.1);
        }

        .action-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--highlight-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .action-button:hover {
            background: #0077b6;
        }

        /* 下部ナビゲーションフロー */
        .bottom-flow {
            margin-top: 40px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .flow-container {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
            max-width: 80%;
        }

        .flow-chip {
            background: rgba(255,255,255,0.05);
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            white-space: nowrap;
            border: 1px solid transparent;
        }

        .flow-chip.active {
            background: var(--highlight-blue);
            color: #fff;
            font-weight: bold;
        }

        .flow-arrow {
            color: rgba(255,255,255,0.3);
            font-size: 0.8rem;
        }

        .more-link {
            background: #f77f00;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .more-link:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="main-layout">
        
        <!-- 左カラム -->
        <div class="left-column">
            <div>
                <p class="brand-title">MOMDO BODY EXPLORER</p>
                <h1 class="main-heading">身体を知る。</h1>
                <p class="sub-heading">股関節を深く理解する。</p>
                <p class="intro-text">身体は、ひとつの部品だけでできているわけではありません。繋がりを知ることで、今の自分の身体が見えてきます。</p>
            </div>

            <!-- 人体ビジュアルエリア -->
            <div class="model-placeholder">
                <!-- 実際のサイトではここに発光エフェクト付きの人体透過画像などを重ねます -->
            </div>

            <!-- ステップナビゲーション -->
            <div class="step-list">
                <div class="step-item">
                    <div class="step-badge">STEP<span>1</span></div>
                    <div class="step-content">全身のイラストから気になる部位を選ぶ</div>
                </div>
                <div class="step-item">
                    <div class="step-badge">STEP<span>2</span></div>
                    <div class="step-content">選んだ部位の構造や働きを知る</div>
                </div>
                <div class="step-item active">
                    <div class="step-badge">STEP<span>3</span></div>
